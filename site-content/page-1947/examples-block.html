<style>
.sabx{max-width:1200px;margin:30px auto 28px;padding:0 14px;font-family:"Exo 2",system-ui,sans-serif;scroll-margin-top:150px}
.pr-sec .sabx{max-width:none;margin:30px 0 28px;padding:0}
.sabx-hd{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 16px}
.sabx h2{margin:0;font-size:30px;font-weight:700;line-height:1.15;display:flex;align-items:center;gap:14px;color:#fff}
.sabx h2 span{flex:none;width:40px;height:40px;border-radius:10px;background:rgba(245,158,11,.12);border:1px solid rgba(245,158,11,.25);display:flex;align-items:center;justify-content:center}
.sabx-pg{display:flex;align-items:center;gap:10px;color:#94A3B8;font:600 13px Roboto,sans-serif}
.sabx-pg button{width:44px;height:44px;border-radius:6px;border:1px solid rgba(255,255,255,.1);background:#131B2E;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer}
.sabx-pg button:disabled{opacity:.4;cursor:default}
.sabx-t{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:14px}
.sabx-t::-webkit-scrollbar{display:none}
.sabx-t button{flex:none;min-height:40px;padding:0 16px;border-radius:6px;border:1px solid rgba(255,255,255,.08);background:#131B2E;color:#fff;font:700 14px "Exo 2",system-ui,sans-serif;cursor:pointer}
.sabx-t button[aria-selected=true]{border-color:#F59E0B;background:rgba(245,158,11,.14);color:#F59E0B}
.sabx-g{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.sab{background:#131B2E;border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0;min-height:250px}
.sab[hidden]{display:none}
.sab-h{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.sab-h b{display:block;font-size:16px;line-height:1.25;color:#fff}
.sab-h small{display:block;margin-top:4px;font:400 13px/1.55 Roboto,sans-serif;color:#94A3B8}
.sab-h em{flex:none;font:700 11px/1 "Exo 2",system-ui,sans-serif;letter-spacing:.08em;padding:4px 6px;color:#CBD5E1;font-style:normal}
.sab iframe{display:block;width:100%;aspect-ratio:16/9;border:0;border-radius:10px;background:#000;margin-top:auto}
.sab-ab{margin-top:auto}
.sab-c{display:flex;align-items:center;gap:10px}
.sab-p{flex:none;width:44px;height:44px;border-radius:6px;border:0;background:#F59E0B;color:#111;display:flex;align-items:center;justify-content:center;cursor:pointer}
.sab-p .pa,.sab.on .sab-p .pl{display:none}.sab.on .sab-p .pa{display:block}
.sab-w{position:relative;flex:1;min-width:0;height:44px;cursor:pointer}
.sab-w i{position:absolute;inset:0;background-size:100% 100%;background-repeat:no-repeat}
.sab-w .x{clip-path:inset(0 calc(100% - var(--p,0%)) 0 0)}
.sab-w .a,.sab.aft .sab-w .b{display:none}.sab.aft .sab-w .a{display:block}
.sab-s{position:relative;display:grid;grid-template-columns:1fr 1fr;width:100%;height:46px;margin-top:10px;padding:4px;box-sizing:border-box;border-radius:6px;border:1px solid rgba(255,255,255,.08);background:#0B1220;cursor:pointer;font:inherit}
.sab-s i{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:4px;background:#2A3754;transition:left .2s ease,background .2s ease}
.sab.aft .sab-s i{left:50%;background:#F59E0B}
.sab-s span{position:relative;display:flex;align-items:center;justify-content:center;font:700 13px "Exo 2",system-ui,sans-serif;letter-spacing:.06em;color:#94A3B8}
.sab:not(.aft) .sab-s span:first-of-type{color:#fff}.sab.aft .sab-s span:last-of-type{color:#111}
.pr-tabs .sabx-go{flex:1 0 auto;display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 14px;border-radius:10px;border:1px solid rgba(245,158,11,.6);background:rgba(245,158,11,.1);color:#F59E0B;font:inherit;cursor:pointer;white-space:nowrap}
.pr-tabs .sabx-go b{font-size:14px;font-weight:700}.pr-tabs .sabx-go small{font-size:11.5px;color:#FCD34D}
.pr-tabs .sabx-go:hover{background:rgba(245,158,11,.2)}
@media(max-width:900px){.sabx-g{grid-template-columns:1fr}.sab{min-height:0}.sabx h2{font-size:24px}}
</style>
