<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Slider wow variants</title>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@500;600;700;800&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b1020;--card:#111a2e;--line:rgba(255,255,255,.09);--tx:#e2e8f0;--mut:#94a3b8;--am:#f59e0b;--am2:#fbbf24}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:"Exo 2",Roboto,sans-serif;overflow-x:hidden}
.top{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:#11161f;border-bottom:1px solid var(--line);position:relative;z-index:5}
.logo{font:800 34px "Exo 2";color:var(--am)}.ic{display:flex;gap:8px}.ic span{width:42px;height:42px;border-radius:10px;border:1px solid var(--line);display:grid;place-items:center;font-size:18px;color:#fff}.ic span.on{background:var(--am);color:#111;border:0}
.stage{position:relative;padding:14px 12px 22px;overflow:hidden;min-height:700px}
.vlabel{position:absolute;right:10px;top:8px;z-index:9;background:#7c3aed;color:#fff;font:700 12px Roboto;padding:5px 9px;border-radius:8px}
/* the existing card (structure unchanged) */
.cardx{position:relative;z-index:3;max-width:760px;margin:0 auto;background:rgba(17,26,46,.9);border:1px solid var(--line);border-radius:22px;padding:16px 14px 14px}
.cardx h2{margin:0 0 10px;font:800 25px "Exo 2";color:#fff}.cardx h2 em{font-style:normal;color:var(--am)}
.tabs{display:flex;gap:8px;overflow:hidden;margin-bottom:12px}.tabs b{flex:none;display:flex;gap:6px;align-items:center;height:40px;padding:0 12px;border-radius:10px;border:1px solid var(--line);font:700 14px "Exo 2";color:#e2e8f0}.tabs b.on{border-color:var(--am);color:var(--am);background:rgba(245,158,11,.1)}
.inner{border:1px solid var(--line);border-radius:16px;padding:14px;background:rgba(10,15,28,.6)}
.inner h3{margin:0 0 4px;font:600 19px "Exo 2";color:#fff}.inner p{margin:0 0 10px;color:var(--mut);font-size:13.5px}
.lab{font:700 11.5px Roboto;letter-spacing:.12em;color:var(--mut);margin:10px 0 6px}
.chips{display:flex;gap:6px;overflow:hidden}.chips i{flex:none;font-style:normal;height:34px;padding:0 12px;display:grid;place-items:center;border-radius:9px;border:1px solid var(--line);font:600 14px "Exo 2"}.chips i.on{border-color:var(--am);color:var(--am);background:rgba(245,158,11,.08)}
.bpm{display:flex;align-items:center;gap:10px}.bar{flex:1;height:8px;border-radius:8px;background:#334155;position:relative}.bar:before{content:"";position:absolute;left:0;top:0;bottom:0;width:48%;border-radius:8px;background:var(--am)}.bar:after{content:"";position:absolute;left:46%;top:-6px;width:20px;height:20px;border-radius:50%;background:var(--am)}
.num{width:76px;height:40px;border:1px solid var(--line);border-radius:9px;display:grid;place-items:center;font:700 18px "Exo 2";color:#fff}
.btns{display:flex;gap:8px;margin-top:12px}.btns b{flex:1.4;height:46px;border-radius:10px;background:var(--am);color:#111;display:grid;place-items:center;font:800 16px "Exo 2"}.btns b+b{flex:1;background:#1e293b;color:#fff;border:1px solid var(--line)}
.dots{display:flex;gap:7px;justify-content:center;margin-top:12px}.dots i{width:9px;height:9px;border-radius:9px;background:#334155}.dots i.on{width:26px;background:var(--am)}
.hl{position:relative;z-index:3;text-align:center;margin:4px auto 14px;max-width:760px}
.hl .k{display:inline-flex;gap:7px;align-items:center;font:700 11.5px Roboto;letter-spacing:.14em;text-transform:uppercase;color:var(--am2);padding:5px 10px;border-radius:999px;background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.3)}
.hl h1{margin:10px 0 0;font:800 30px/1.08 "Exo 2";color:#fff}.hl h1 em{font-style:normal;background:linear-gradient(90deg,#f59e0b,#f472b6,#a78bfa);-webkit-background-clip:text;color:transparent}
.live{width:7px;height:7px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 4px rgba(34,197,94,.2)}

/* ===== A: living sound ===== */
.A .stage{background:radial-gradient(80% 50% at 50% 0%,rgba(245,158,11,.18),transparent 70%),radial-gradient(70% 60% at 100% 60%,rgba(167,139,250,.18),transparent 70%),var(--bg)}
.A .viz{position:relative;height:96px;margin:-6px -12px 6px;overflow:hidden;display:flex;gap:4px;align-items:center;justify-content:center;opacity:.95;z-index:2;-webkit-mask:linear-gradient(90deg,transparent,#000 15%,#000 85%,transparent)}
.A .viz i{flex:none;width:5px;border-radius:6px;box-shadow:0 0 12px rgba(245,158,11,.5);background:linear-gradient(#fbbf24,#f472b6 60%,#7c3aed);animation:vz 1.2s ease-in-out infinite}
@keyframes vz{0%,100%{transform:scaleY(.45)}50%{transform:scaleY(1)}}
.A .cardx{background:rgba(13,20,38,.82);backdrop-filter:blur(14px)}
.A .cardx:before{content:"";position:absolute;inset:-2px;border-radius:24px;padding:2px;background:conic-gradient(from 0deg,#f59e0b,#f472b6,#7c3aed,#22d3ee,#f59e0b);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;z-index:-1;opacity:.9}
.match{display:flex;align-items:center;gap:10px;margin-top:12px;padding:10px;border-radius:12px;background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.25)}
.match .cv{display:flex}.match .cv img{width:40px;height:40px;border-radius:8px;object-fit:cover;border:2px solid #0b1020;margin-left:-10px}.match .cv img:first-child{margin-left:0}
.match b{color:#fff;font:700 14.5px "Exo 2"}.match small{display:block;color:var(--mut);font:400 12.5px Roboto}

/* ===== B: cover wall ===== */
.B .wall{position:absolute;inset:-60px -40px auto -40px;height:1100px;z-index:1;transform:perspective(900px) rotateX(18deg) rotateZ(-8deg);opacity:.85}
.B .row{display:flex;gap:12px;margin-bottom:12px;width:max-content;animation:mq 40s linear infinite}.B .row:nth-child(2){animation-direction:reverse;margin-left:-120px}.B .row:nth-child(3){margin-left:-60px}
.B .row img{width:130px;height:130px;border-radius:14px;object-fit:cover;box-shadow:0 10px 30px rgba(0,0,0,.5)}
@keyframes mq{to{transform:translateX(-50%)}}
.B .stage:after{content:"";position:absolute;inset:0;z-index:2;background:linear-gradient(180deg,rgba(11,16,32,.1),rgba(11,16,32,.45) 40%,rgba(11,16,32,.8))}
.B .cardx{background:rgba(15,22,40,.62);backdrop-filter:blur(16px) saturate(1.3);border-color:rgba(255,255,255,.16);box-shadow:0 30px 80px rgba(0,0,0,.6)}

/* ===== C: studio ===== */
.C .stage{background:#0a0e18}
.C .grid{position:absolute;inset:0;z-index:1;display:grid;grid-template-columns:repeat(8,1fr);grid-auto-rows:34px;gap:5px;padding:8px;opacity:.9}
.C .grid i{border-radius:4px;background:#161e30;animation:clip 2s steps(1) infinite}
@keyframes clip{0%{background:#161e30}50%{background:var(--c)}}
.C .stage:after{content:"";position:absolute;inset:0;z-index:2;background:radial-gradient(80% 60% at 50% 50%,rgba(10,14,24,.75),rgba(10,14,24,.25))}
.C .now{position:relative;z-index:3;max-width:760px;margin:0 auto 12px;display:flex;gap:12px;align-items:center;padding:10px;border-radius:16px;background:rgba(17,26,46,.9);border:1px solid rgba(245,158,11,.35)}
.C .now img{width:56px;height:56px;border-radius:10px;object-fit:cover}
.C .now .pl{width:44px;height:44px;flex:none;border-radius:50%;background:var(--am);color:#111;display:grid;place-items:center;font-size:16px;box-shadow:0 0 0 6px rgba(245,158,11,.18)}
.C .now b{display:block;color:#fff;font:700 15px "Exo 2"}.C .now small{color:var(--mut);font:400 12px Roboto}
.C .wv{display:flex;gap:2px;align-items:center;height:22px;margin-top:4px}.C .wv i{width:3px;border-radius:2px;background:var(--am);animation:vz 1s ease-in-out infinite}
.C .cardx{background:rgba(17,26,46,.8);backdrop-filter:blur(10px)}

@media(min-width:900px){.stage{padding:28px 20px 36px}.hl h1{font-size:44px}.cardx{padding:22px}.A .viz{height:110px}.B .row img{width:170px;height:170px}.C .grid{grid-template-columns:repeat(16,1fr);grid-auto-rows:40px}}
</style></head><body>
<div class="top"><div class="logo">S▷</div><div class="ic"><span>⌕</span><span>🛒</span><span class="on">→]</span><span>☰</span></div></div>
<div class="stage" id="st"><div class="vlabel" id="vl"></div>
 <div id="bg"></div>
 <div class="hl" id="hl"></div>
 <div id="pre"></div>
 <div class="cardx">
  <h2>What are you <em>working on?</em></h2>
  <div class="tabs"><b class="on">🎹 Writing a track</b><b>🎚 Finishing a track</b><b>🚀 Releasing</b><b>🎧 DJ</b></div>
  <div class="inner"><h3>Templates & presets for your next track</h3><p>Real Ableton projects you can open, learn from and finish.</p>
   <div class="lab">GENRE</div><div class="chips"><i class="on">Techno</i><i>Dark Techno</i><i>Melodic Techno</i><i>Afro House</i></div>
   <div class="lab">BPM</div><div class="bpm"><div class="bar"></div><div class="num">130</div><span style="font:700 16px 'Exo 2'">BPM</span></div>
   <div class="lab">KEY</div><div class="chips"><i class="on">Am</i><i>Bm</i><i>G</i><i>Any</i></div>
   <div id="extra"></div>
   <div class="btns"><b>Show templates →</b><b>Presets</b></div>
  </div>
  <div class="dots"><i class="on"></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
 </div>
</div>
<script>
var V=(location.hash||'#A').slice(1),C=['Mutualism.jpg','Kratos.jpg','Infinity.jpg','Pitch.jpg','Intricate.jpg','Protos.jpg','Presets.jpg','Piano.png'];
document.body.className=V;document.getElementById('vl').textContent='Variant '+V+' · mockup';
var bg=document.getElementById('bg'),hl=document.getElementById('hl'),pre=document.getElementById('pre'),ex=document.getElementById('extra');
if(V==='A'){var v=document.createElement('div');v.className='viz';for(var i=0;i<Math.floor(innerWidth/9);i++){var b=document.createElement('i');b.style.height=(28+Math.abs(Math.sin(i/5))*56+Math.random()*16)+'px';b.style.animationDelay=(-(i%17)/10)+'s';v.appendChild(b)}
 hl.innerHTML='<span class="k"><span class="live"></span>Learn · Create · Release</span><h1>Turn Your Ideas into <em>Solid Sound</em></h1>';hl.after(v);
 ex.innerHTML='<div class="match"><div class="cv"><img src="Mutualism.jpg"><img src="Kratos.jpg"><img src="Infinity.jpg"></div><div><b>3 templates match</b><small>Techno · 130 BPM · Am — tap to listen</small></div></div>'}
if(V==='B'){var w=document.createElement('div');w.className='wall';for(var r=0;r<5;r++){var row=document.createElement('div');row.className='row';for(var k=0;k<16;k++){var im=document.createElement('img');im.src=C[(k+r*3)%C.length];row.appendChild(im)}w.appendChild(row)}bg.appendChild(w);
 hl.innerHTML='<span class="k"><span class="live"></span>Learn · Create · Release</span><h1>Turn Your Ideas into <em>Solid Sound</em></h1>'}
if(V==='C'){var g=document.createElement('div');g.className='grid';var cols=['#f59e0b','#f472b6','#a78bfa','#22d3ee','#22c55e','#fb7185'];for(var i=0;i<16*30;i++){var c=document.createElement('i');if(Math.random()<.45){c.style.setProperty('--c',cols[i%cols.length]);c.style.animationDelay=(-(i%8)*.25)+'s';c.style.animationDuration=(1+(i%4)*.5)+'s'}else c.style.animation='none';g.appendChild(c)}bg.appendChild(g);
 hl.innerHTML='<span class="k"><span class="live"></span>Learn · Create · Release</span><h1>Turn Your Ideas into <em>Solid Sound</em></h1>';
 var bars='';for(var i=0;i<28;i++)bars+='<i style="height:'+(25+Math.random()*75)+'%;animation-delay:-'+(Math.random()).toFixed(2)+'s"></i>';
 pre.innerHTML='<div class="now"><img src="Mutualism.jpg"><div style="flex:1;min-width:0"><b>Now playing · Mutualism</b><small>Dark Techno · Ableton 11 · native plugins · $13</small><div class="wv">'+bars+'</div></div><div class="pl">❚❚</div></div>'}
</script></body></html>
