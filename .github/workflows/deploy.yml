# Deploy plugin/solid-sound-custom to the live site over FTP.
# Trigger: a commit that changes .github/deploy.txt (or Actions -> Deploy plugin -> Run workflow).
# Safety: 1) the build must be up to date and pass PHP lint;
#         2) the current server copy is downloaded first (artifact "server-backup-<run>")
#         3) after upload the site is checked; on a PHP fatal error the backup is put back automatically.
# Rollback by hand: revert the plugin/ change in git and bump .github/deploy.txt.
name: Deploy plugin
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/deploy.txt"]
concurrency: deploy
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USER: ${{ secrets.FTP_USER }}
      FTP_PASS: ${{ secrets.FTP_PASS }}
      REMOTE: solid-sound.net/www/wp-content/plugins/solid-sound-custom
      SITE: https://solid-sound.net/en/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Rebuild and verify the committed build is current
        run: |
          npm i --no-save esbuild@0.24.2
          node tools/build.mjs
          git status --porcelain plugin/ | tee /tmp/dirty
          [ ! -s /tmp/dirty ] || { echo "::error::build/ is out of date: run node tools/build.mjs and commit"; exit 1; }
          find plugin -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Back up the server copy
        run: |
          python3 tools/ftp_sync.py download "$REMOTE" server-backup
          test -f server-backup/solid-sound-custom.php
      - uses: actions/upload-artifact@v4
        with: { name: "server-backup-${{ github.run_number }}", path: server-backup, retention-days: 90 }
      - name: Upload (build first, loader last)
        run: |
          P=plugin/solid-sound-custom
          python3 tools/ftp_sync.py upload $P/build "$REMOTE/build"
          python3 tools/ftp_sync.py upload $P/includes "$REMOTE/includes"
          python3 tools/ftp_sync.py upload $P/backup "$REMOTE/backup"
          python3 tools/ftp_sync.py upload $P/solid-sound-custom.php "$REMOTE/solid-sound-custom.php"
      - name: Health check (auto-rollback on PHP fatal error)
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/130.0 Safari/537.36"
          mkdir -p deploy-log; LOG=deploy-log/last.txt
          echo "run ${{ github.run_number }} $(date -u +%FT%TZ) commit ${{ github.sha }}" > $LOG
          bad=0
          for u in "$SITE?ss_v2=0" "$SITE?ss_v2=1" "https://solid-sound.net/product/infinity/?ss_v2=1" "https://solid-sound.net/en/my-account/?ss_v2=1"; do
            for i in 1 2 3 4 5; do
              code=$(curl -s -A "$UA" -o page.html -w '%{http_code}' "$u&nocache=$RANDOM")
              [ "$code" = 429 ] && { sleep 20; continue; }; break
            done
            hit=$(grep -oiE 'There has been a critical error[^<]{0,80}|<b>(Fatal|Parse) error</b>.{0,300}' page.html | head -2)
            echo "$u -> HTTP $code ${hit:+FATAL: $hit}" | tee -a $LOG
            if [ "${code:0:1}" = 5 ] || [ -n "$hit" ]; then bad=1; fi
          done
          if [ $bad = 1 ]; then
            echo "ROLLED BACK" | tee -a $LOG
            python3 tools/ftp_sync.py restore server-backup "$REMOTE"
          else
            echo "OK" | tee -a $LOG
          fi
          echo $bad > /tmp/bad
      - name: Save the deploy log in the repo
        if: always()
        run: |
          git config user.name "deploy-bot"; git config user.email "actions@users.noreply.github.com"
          git add deploy-log && git commit -m "deploy log: run ${{ github.run_number }}" && git pull --rebase -q origin main && git push || true
          [ "$(cat /tmp/bad 2>/dev/null)" != 1 ]
