# Read-only look at a public page (competitors). Run: add «<date> <url>» to .github/page-look.txt. Result: artifact page-look.
name: Page look
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/page-look.txt"]
permissions:
  contents: write
jobs:
  look:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - run: npm i --no-save playwright@1.49.1
      - name: Look
        env: { PW_CHANNEL: chrome }
        run: node tools/page-look.js
      - name: Save to branch shots-page
        if: always()
        run: |
          cd page-out && git init -q -b shots-page && git config user.name photographer && git config user.email actions@users.noreply.github.com
          git add -A && git commit -qm "page look: $(date -u +%FT%TZ)"
          git push -fq "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" shots-page
