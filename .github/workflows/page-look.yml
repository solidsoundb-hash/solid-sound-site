# Read-only look at a public page (competitors). Run: add «<date> <url>» to .github/page-look.txt. Result: artifact page-look.
name: Page look
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/page-look.txt"]
permissions:
  contents: read
jobs:
  look:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i --no-save playwright@1.49.1
      - name: Look
        env: { PW_CHANNEL: chrome }
        run: node tools/page-look.js
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: page-look, path: page-out/, retention-days: 7 }
