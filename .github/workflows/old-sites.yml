# Pull texts and media out of the owner's old sub-sites before removing them (owner 21.11.2026).
# Run: last line of .github/old-sites.txt = list of sub-domains. Result: branch `old-sites`, folder old-sites/<sub>/.
name: Old sites (rescue content)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/old-sites.txt"]
permissions:
  contents: write
concurrency: old-sites
jobs:
  rescue:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Rescue
        run: python3 tools/old-sites.py $(tail -1 .github/old-sites.txt | grep -o 'subs:.*' | cut -d: -f2)
      - name: Save to branch old-sites
        if: always()
        run: |
          git fetch -q origin old-sites && git worktree add -q os origin/old-sites || (git worktree add -q --detach os && cd os && git checkout -q --orphan tmp && git rm -rqf . ; true)
          mkdir -p os/old-sites && cp -r old-sites/* os/old-sites/ && cd os
          git config user.name rescue-robot && git config user.email actions@users.noreply.github.com
          git add -A && git commit -qm "old sites: $(date -u +%FT%TZ)" && git push -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:old-sites
