# SUPPORT-MORNING — robot of «Продажи и поддержка»: new orders (paid / not paid), cart & checkout views without an order,
# new forum topics → reports/support/morning.md. No personal data (public repo). Steps 1–2 passed 25.11.2026 →
# every day 04:23 UTC (before the coordinator's 05:40 Paris digest). On demand: a line in .github/support-morning.txt.
name: Support morning
on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * *"
  push:
    branches: [main]
    paths: [".github/support-morning.txt"]
permissions:
  contents: write
concurrency: support-morning
jobs:
  morning:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with: { ref: main }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Exam (docs/team/bots.md)
        run: node tools/bots/support-morning/exam.js
      - run: npm i --no-save playwright@1.49.1
      - name: Orders, carts, forum
        env:
          PW_CHANNEL: chrome
          TEST_ADMIN_USER: ${{ secrets.TEST_ADMIN_USER }}
          TEST_ADMIN_PASS: ${{ secrets.TEST_ADMIN_PASS }}
        run: node tools/bots/support-morning.js
      - name: Save
        if: always()
        run: |
          BOT_NAME=support-morning bash .github/save.sh "support morning: $(date -u +%F)" reports/support
