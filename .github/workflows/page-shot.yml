# Before / after pictures of our pages (owner 20.11 rule: screenshots before and after every change).
# Run: add «<date> <label> /path/ /path2/» to .github/page-shot.txt. Result: branch shots-ab, folder <label>/ (report.md + JPEG).
name: Page shot
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/page-shot.txt"]
permissions:
  contents: write
concurrency: { group: page-shot, cancel-in-progress: false }  # own queue (22.11): sharing «shots-ab» with probe let a 3rd run cancel the 2nd
jobs:
  shot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - run: npm i --no-save playwright@1.49.1
      - name: Shoot
        env: { PW_CHANNEL: chrome }
        run: node tools/page-shot.js
      - name: Save to branch shots-ab
        if: always()
        run: |
          BOT_NAME=photographer GH_TOKEN=${{ github.token }} bash .github/save-branch.sh shots-ab "page shot: $(date -u +%FT%TZ)" page-shot/*
