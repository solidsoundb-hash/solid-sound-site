# QA bot ("автотестировщик"): walks the site like a person and writes a bug list.
#  - full check once a week, Monday night (all pages, all languages, every button) -> qa/latest/
#  - on demand only otherwise (owner 13.11.2026: "раз в неделю, если что-то нужно — напишу сам"):
#    a line in .github/qa.txt ("full" / "smoke" in the line, otherwise the daily-size check)
# Free GitHub minutes are limited (2000/month for a private repo) — that is why checks after deploys are short.
name: QA bot
on:
  workflow_dispatch:
    inputs:
      mode: { description: "smoke, quick or full", default: "quick" }
  workflow_call:                 # started by the main robot (main-robot.yml) every Monday
    inputs:
      mode: { type: string, default: "full" }
  push:
    branches: [main]
    paths: [".github/qa.txt"]
permissions:
  contents: write
concurrency: qa-bot
jobs:
  qa:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - name: Pick the mode
        id: mode
        run: |
          M=quick
          [ -n "${{ inputs.mode }}" ] && M="${{ inputs.mode }}"
          case "${{ github.event_name }}" in
            push) L=$(tail -1 .github/qa.txt); echo "$L" | grep -qi full && M=full; echo "$L" | grep -qi smoke && M=smoke ;;
          esac
          OUT=qa/latest; [ "$M" = smoke ] && OUT=qa/smoke
          B=40; [ "$M" = full ] && B=105; [ "$M" = smoke ] && B=8
          echo "mode=$M" >> $GITHUB_OUTPUT; echo "out=$OUT" >> $GITHUB_OUTPUT; echo "budget=$B" >> $GITHUB_OUTPUT
          # after deploys: at most once every 2 hours (the nightly check covers the rest)
          if [ "$M" = smoke ] && [ "${{ github.event_name }}" = workflow_run ] && [ -f qa/smoke/bugs.json ]; then
            last=$(python3 -c "import json,datetime;d=json.load(open('qa/smoke/bugs.json'))['date'];print(int(datetime.datetime.fromisoformat(d.replace('Z','+00:00')).timestamp()))" 2>/dev/null || echo 0)
            if [ $(( $(date +%s) - last )) -lt 7200 ]; then echo "skip=1" >> $GITHUB_OUTPUT; echo "checked recently, skipping"; fi
          fi
      - uses: actions/setup-node@v4
        if: steps.mode.outputs.skip != '1'
        with: { node-version: 22 }
      - run: npm i --no-save playwright@1.49.1
        if: steps.mode.outputs.skip != '1'
      - name: Run the QA bot
        if: steps.mode.outputs.skip != '1'
        timeout-minutes: 160
        env:
          QA_MODE: ${{ steps.mode.outputs.mode }}
          QA_OUT: ${{ steps.mode.outputs.out }}
          QA_BUDGET_MIN: ${{ steps.mode.outputs.budget }}
          PW_CHANNEL: chrome   # Google Chrome is preinstalled on GitHub runners
          TEST_USER: ${{ secrets.TEST_USER }}
          TEST_PASS: ${{ secrets.TEST_PASS }}
          TEST_ADMIN_USER: ${{ secrets.TEST_ADMIN_USER }}
          TEST_ADMIN_PASS: ${{ secrets.TEST_ADMIN_PASS }}
        run: node tools/qa/qa.js
      - name: Save the report in the repo
        if: always() && steps.mode.outputs.skip != '1'
        run: |
          BOT_NAME=qa-bot bash .github/save.sh "QA bot (${{ steps.mode.outputs.mode }}): $(date -u +%FT%TZ)" qa
