# Менеджер авторов (25.11.2026): проверка товаров — обложка, демо, описание (только чтение).
# Run: Actions → Authors check → Run workflow (manual, stages per docs/team/bots.md). Result: reports/authors/products.md on main.
name: Authors check
# Лестница (docs/team/bots.md): ступень 1 — ONLY_IDS=1102, ступень 2 — LIMIT=9, ступень 3 — расписание (добавить после зачёта).
on:
  workflow_dispatch:
    inputs:
      only_ids: { description: "ID товаров через запятую (ступень 1)", default: "1102" }
      limit: { description: "Сколько товаров (ступень 2), 0 = все", default: "0" }
  schedule:
    - cron: "23 3 * * 3"  # 28.11 «Задачи»: раз в неделю (ср) — авторы ждут решения владельца
  push:
    branches: [main]
    paths: [".github/authors-check.txt"]  # последняя строка: "only=1102" или "limit=9" или "all"
permissions:
  contents: write
concurrency: authors-check
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: ffprobe
        run: which ffprobe || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null)
      - name: Check products
        env:
          IN_ONLY: ${{ github.event.inputs.only_ids }}
          IN_LIMIT: ${{ github.event.inputs.limit }}
        run: |
          L=$(tail -n1 .github/authors-check.txt 2>/dev/null || true)
          export ONLY_IDS="$IN_ONLY" LIMIT="$IN_LIMIT"
          if [ "${{ github.event_name }}" = "push" ]; then
            ONLY_IDS=$(echo "$L" | grep -oP 'only=\K[0-9,]+' || true); LIMIT=$(echo "$L" | grep -oP 'limit=\K[0-9]+' || true)
          fi
          echo "ONLY_IDS=$ONLY_IDS LIMIT=$LIMIT"
          python3 tools/authors-check.py
      - name: Save report
        if: always()
        run: |
          git config user.name authors-robot && git config user.email actions@users.noreply.github.com
          git add reports/authors && git commit -qm "authors: проверка товаров $(date -u +%F)" || exit 0
          for i in 1 2 3 4; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done
