# Менеджер авторов (25.11.2026): проверка товаров — обложка, демо, описание (только чтение).
# Run: add a line to .github/authors-check.txt (or daily schedule). Result: reports/authors/products.md on main.
name: Authors check
on:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * *"
  push:
    branches: [main]
    paths: [".github/authors-check.txt", "tools/authors-check.py"]
permissions:
  contents: write
concurrency: authors-check
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: ffprobe
        run: which ffprobe || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null)
      - name: Check products
        run: python3 tools/authors-check.py
      - name: Save report
        if: always()
        run: |
          git config user.name authors-robot && git config user.email actions@users.noreply.github.com
          git add reports/authors && git commit -qm "authors: проверка товаров $(date -u +%F)" || exit 0
          for i in 1 2 3 4; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done
