# One-off probes of the live site (read-only). Run: add «<date> <name>» to .github/probe.txt → node tools/probe/<name>.js,
# output pushed to branch shots-ab, folder probe-<name>/.
name: Probe
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/probe.txt"]
permissions:
  contents: write
concurrency: { group: probe, cancel-in-progress: false }  # own queue (22.11): sharing «shots-ab» with page-shot let a 3rd run cancel the 2nd
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i --no-save playwright@1.49.1
      - name: Probe
        run: |
          N=$(tail -1 .github/probe.txt | awk '{print $NF}' | tr -cd 'a-z0-9-')
          echo "N=$N" >> $GITHUB_ENV
          PW_CHANNEL=chrome PROBE_OUT="probe-$N" node "tools/probe/$N.js"
      - name: Save to branch shots-ab
        if: always()
        run: |
          BOT_NAME=photographer GH_TOKEN=${{ github.token }} bash .github/save-branch.sh shots-ab "probe $N: $(date -u +%FT%TZ)" "probe-$N"
