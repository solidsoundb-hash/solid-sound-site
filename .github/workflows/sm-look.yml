# Read-only screenshots of our creator area (store manager) as the test vendor and the test admin.
# Run: add a line to .github/sm-look.txt. Needs secrets TEST_VENDOR_USER/PASS (and TEST_ADMIN_USER/PASS).
# Result: artifact "sm-screens" (7 days) + the test vendor's creator space (dashboard, desktop and phone) committed to checks/sm-look/
# (18.11: the cloud Claude cannot download artifacts). Nothing is changed on the site.
name: Store manager look
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/sm-look.txt"]
permissions:
  contents: write
jobs:
  look:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i --no-save playwright@1.49.1
      - name: Look (read-only)
        env:
          PW_CHANNEL: chrome
          TEST_VENDOR_USER: ${{ secrets.TEST_VENDOR_USER }}
          TEST_VENDOR_PASS: ${{ secrets.TEST_VENDOR_PASS }}
          TEST_ADMIN_USER: ${{ secrets.TEST_ADMIN_USER }}
          TEST_ADMIN_PASS: ${{ secrets.TEST_ADMIN_PASS }}
        run: node tools/sm-look.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sm-screens
          path: sm-out/
          retention-days: 7
      - name: Commit the test vendor's dashboard screenshots
        if: always()
        run: |
          mkdir -p checks/sm-look && rm -f checks/sm-look/*.jpg
          cp sm-out/vendor_*_01_*.jpg checks/sm-look/ 2>/dev/null || true
          grep -v "^## admin" sm-out/report.txt | grep -B0 -A2 "vendor_" > checks/sm-look/report.txt 2>/dev/null || true
          git config user.name main-robot && git config user.email actions@users.noreply.github.com
          git add checks/sm-look && git commit -qm "creator space look: $(date -u +%FT%TZ)" || exit 0
          for i in 1 2 3 4; do git pull --rebase -q && git push -q && break; sleep 5; done
