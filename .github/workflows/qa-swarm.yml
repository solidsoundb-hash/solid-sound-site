# QA swarm ("рой тестировщиков", owner 17.11.2026: «гит хаб боты неограниченны — грузи по максимуму»).
# The repo is public, so GitHub minutes are free. Many robots check the site at the same time:
#   - 8 robots split all pages of the sitemap (computer + phone, every button, sound, links of their pages, screenshots);
#   - 3 robots: owner's phone (Samsung A31) + languages + scenarios / logins / ears (every sound preview, ffmpeg);
#   - 9 "neural eyes" robots: a local vision model (Ollama, free) looks at every screenshot;
#   - the last robot merges everything into one report: qa/latest/report.md.
# Limit: not GitHub but the hosting — 8 robots at once made the home load 15 s (17.11), so at most 3 on the site at once
# (+ the sound robot, which only downloads files). Neural eyes run on GitHub only and do not touch the site.
# Start: a line in .github/swarm.txt (22.11; was a «swarm» line in qa.txt), or by hand (Actions → QA swarm → Run).
name: QA swarm
on:
  workflow_dispatch:
  schedule:
    - cron: "47 22 * * *"   # every night 22:47 UTC, ~2 h → done before speed 03:41 / content 03:17 / home-look 04:19 (22.11 schedule)
  workflow_call:
  push:
    branches: [main]
    paths: [".github/swarm.txt"]   # own command file (22.11): «qa.txt» woke this swarm AND qa-bot
permissions:
  contents: write
concurrency: qa-swarm
env:
  PW_CHANNEL: chrome
jobs:
  go:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.c.outputs.run }}
      t0: ${{ steps.c.outputs.t0 }}
      l10n: ${{ steps.c.outputs.l10n }}
    steps:
      - uses: actions/checkout@v4
      - id: c
        run: |
          R=1
          # any line in .github/swarm.txt starts the swarm
          echo "run=$R" >> $GITHUB_OUTPUT; echo "t0=$(date +%s)" >> $GITHUB_OUTPUT
          # (20.11 owner «проверь языки») a line with «языки / langs / l10n» turns the translation checks back on
          L=0; [ "${{ github.event_name }}" = push ] && tail -1 .github/swarm.txt | grep -qiE 'язык|langs|l10n' && L=1; echo "l10n=$L" >> $GITHUB_OUTPUT

  pages:
    needs: go
    if: needs.go.outputs.run == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 3     # 17.11: 8 robots at once made the site load 15 s for customers
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i --no-save playwright@1.49.1
      - name: Robot ${{ matrix.shard }} of 8
        timeout-minutes: 140
        env:
          QA_MODE: full
          QA_L10N: ${{ needs.go.outputs.l10n }}
          QA_PARTS: pages,links
          QA_SHARD: ${{ matrix.shard }}/8
          QA_EYES_ALL: "1"
          QA_NOHIST: "1"
          QA_OUT: qa/sw/p${{ matrix.shard }}
          QA_BUDGET_MIN: 115
        run: mkdir -p "$QA_OUT" && node tools/qa/qa.js
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: "p${{ matrix.shard }}", path: "qa/sw/p${{ matrix.shard }}", retention-days: 7 }

  extras:
    needs: [go, pages]
    if: always() && needs.go.outputs.run == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: x0, parts: "a31,langs,scen" }
          - { name: x1, parts: "login" }
          - { name: x2, parts: "ears" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i --no-save playwright@1.49.1
      - name: "ffmpeg for the ears (17.11 - the runner image has none)"
        if: contains(matrix.parts, 'ears')
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null && ffmpeg -version | head -1
      - name: Robot ${{ matrix.name }} (${{ matrix.parts }})
        timeout-minutes: 140
        env:
          QA_MODE: full
          QA_L10N: ${{ needs.go.outputs.l10n }}
          QA_PARTS: ${{ matrix.parts }}
          QA_PAGES: /en/
          QA_EARS_ALL: "1"
          QA_EARS_MAX: "1000"
          QA_NOHIST: "1"
          QA_OUT: qa/sw/${{ matrix.name }}
          QA_BUDGET_MIN: 115
          TEST_USER: ${{ secrets.TEST_USER }}
          TEST_PASS: ${{ secrets.TEST_PASS }}
          TEST_ADMIN_USER: ${{ secrets.TEST_ADMIN_USER }}
          TEST_ADMIN_PASS: ${{ secrets.TEST_ADMIN_PASS }}
        run: mkdir -p "$QA_OUT" && node tools/qa/qa.js
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: "${{ matrix.name }}", path: "qa/sw/${{ matrix.name }}", retention-days: 7 }

  eyes:
    needs: [go, pages, extras]
    if: always() && needs.go.outputs.run == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 170
    strategy:
      fail-fast: false
      matrix:
        src: [p0, p1, p2, p3, p4, p5, p6, p7, x0]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: { name: "${{ matrix.src }}", path: "qa/sw/${{ matrix.src }}" }
      - name: Local vision model (Ollama)
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          (ollama serve > /tmp/ollama.log 2>&1 &) ; sleep 5
          ollama pull qwen2.5vl:3b
      - name: Neural eyes look at the screenshots of ${{ matrix.src }}
        timeout-minutes: 150
        env: { EYES_MAX: "60", EYES_MIN: "140", OLLAMA_MODEL: "qwen2.5vl:3b" }
        run: node tools/qa/llm-eyes.js "qa/sw/${{ matrix.src }}" "qa/sw/e-${{ matrix.src }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: "e-${{ matrix.src }}", path: "qa/sw/e-${{ matrix.src }}", retention-days: 7 }

  plus:
    # (23.11 owner «досоздай всех ботов… универсальный тестировщик») what the others did not cover — tools/qa/plus.js:
    # Safari (iPhone) + Firefox, keyboard only, chaos tester, yesterday-vs-today pictures, odd screen shapes
    needs: [go, extras]
    if: always() && needs.go.outputs.run == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - { name: y0, parts: "browsers" }
          - { name: y1, parts: "keys,monkey" }
          - { name: y2, parts: "visual,shapes" }
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i --no-save playwright@1.49.1
      - name: Safari (WebKit) and Firefox engines
        if: contains(matrix.parts, 'browsers')
        run: npx playwright install --with-deps webkit firefox > /dev/null
      - name: Robot ${{ matrix.name }} (${{ matrix.parts }})
        timeout-minutes: 110
        env: { PLUS_PARTS: "${{ matrix.parts }}", PLUS_OUT: "qa/sw/${{ matrix.name }}", PLUS_BUDGET_MIN: "95" }
        run: node tools/qa/plus.js
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: "${{ matrix.name }}", path: "qa/sw/${{ matrix.name }}", retention-days: 7 }

  merge:
    needs: [go, pages, extras, eyes, plus]
    if: "!cancelled() && needs.go.outputs.run == '1'"   # a stopped run must not overwrite the last good report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i --no-save playwright@1.49.1
      - uses: actions/download-artifact@v4
        with: { path: qa/sw }
      - name: One report from all robots
        env: { QA_MODE: full, QA_OUT: qa/latest, QA_STARTED: "${{ needs.go.outputs.t0 }}" }
        run: |
          D=$(ls -d qa/sw/*/ | sed 's#/$##' | paste -sd, -)
          echo "robots: $D"
          mkdir -p qa/latest && QA_MERGE="$D" node tools/qa/qa.js
          # the chaos/visual robot's small pictures become tomorrow's «yesterday»
          if [ -d qa/sw/y2/base ]; then mkdir -p qa/visual/base && cp qa/sw/y2/base/*.png qa/visual/base/ 2>/dev/null || true; fi
          rm -rf qa/sw
      - name: Save the report in the repo
        run: |
          BOT_NAME=qa-swarm bash .github/save.sh "QA swarm: $(date -u +%FT%TZ)" qa
