# Mobile cart check (25.11, «Тестировщик»): a line in .github/cart-probe.txt → tools/probe/cart.js twice:
# «before» (the live cart as it is) and «preview» (live cart + tools/probe/cart-inject.json = the new CSS/JS before deploy).
# Own queue, so other probes do not push it out. Output: branch shots-ab, folder probe-cart/ (before/ and preview/).
name: Cart probe
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/cart-probe.txt"]
permissions:
  contents: write
concurrency: { group: cart-probe, cancel-in-progress: false }
jobs:
  cart:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i --no-save playwright@1.49.1
      - name: Before
        run: PW_CHANNEL=chrome PROBE_OUT=probe-cart/before node tools/probe/cart.js
      - name: Preview
        if: always()
        run: PREVIEW=1 PW_CHANNEL=chrome PROBE_OUT=probe-cart/preview node tools/probe/cart.js
      - name: Save to branch shots-ab
        if: always()
        run: |
          BOT_NAME=photographer GH_TOKEN=${{ github.token }} bash .github/save-branch.sh shots-ab "probe cart: $(date -u +%FT%TZ)" "probe-cart"
