# Before/after examples scout (owner 21.11.2026). Run: add a line to .github/ab-scout.txt. Result: branch ab-scout.
name: AB scout
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/ab-scout.txt"]
permissions:
  contents: write
concurrency: ab-scout
jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg >/dev/null && pip install -q yt-dlp
      - name: Scout
        run: bash tools/ab-scout.sh
      - name: Save to branch ab-scout
        if: always()
        run: |
          git fetch -q origin ab-scout && git worktree add -q bs origin/ab-scout || (git worktree add -q --detach bs && cd bs && git checkout -q --orphan tmp && git rm -rqf . ; true)
          rm -rf bs/ab-scout && cp -r ab-scout bs/ && cd bs
          git config user.name ab-scout && git config user.email actions@users.noreply.github.com
          git add -A && git commit -qm "ab scout: $(date -u +%FT%TZ)" && git push -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:ab-scout
