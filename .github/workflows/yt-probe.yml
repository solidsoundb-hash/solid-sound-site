# YouTube example probe (owner 21.11.2026). Run: add a video id line to .github/yt-probe.txt. Result: branch yt-probe.
name: YT probe
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/yt-probe.txt"]
permissions:
  contents: write
concurrency: yt-probe
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Tools
        run: sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg >/dev/null && pip install -q -U yt-dlp
      - name: Probe
        run: bash tools/yt-probe.sh "$(tail -1 .github/yt-probe.txt | awk '{print $1}')"
      - name: Save to branch yt-probe
        if: always()
        run: |
          git config user.name yt-probe && git config user.email actions@users.noreply.github.com
          git checkout -q --orphan yt-probe-tmp && git rm -rqf --cached . >/dev/null
          git add -f yt-probe && git commit -qm "yt probe $(date -u +%FT%TZ)" && git push -q -f origin HEAD:yt-probe
