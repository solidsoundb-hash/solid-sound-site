# QA «plus» on its own (23.11): Safari + Firefox, keyboard, chaos tester, yesterday-vs-today, odd screens — tools/qa/plus.js.
# Every night it also runs inside the QA swarm (qa/latest/report.md). Alone: a line in .github/qa-plus.txt → report qa/plus/report.md.
# One robot at a time on the site (hosting limit). Read-only.
name: QA plus
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/qa-plus.txt"]
permissions:
  contents: write
concurrency: { group: qa-plus, cancel-in-progress: false }
jobs:
  plus:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i --no-save playwright@1.49.1
      - name: Safari (iPhone) and Firefox — in Playwright's own image (all their system libraries are there; 23.11 the runner lacked them)
        timeout-minutes: 50
        continue-on-error: true
        run: docker run --rm -v "$PWD":/w -w /w -e PLUS_PARTS=browsers -e PLUS_OUT=qa/sw/plus-b -e PLUS_BUDGET_MIN=40 mcr.microsoft.com/playwright:v1.49.1-noble bash -c "npm i --no-save playwright@1.49.1 > /dev/null 2>&1 && node tools/qa/plus.js"
      - name: Keyboard, chaos, yesterday-vs-today, screens (Chrome)
        timeout-minutes: 90
        env: { PW_CHANNEL: chrome, PLUS_PARTS: "keys,monkey,visual,shapes", PLUS_OUT: qa/sw/plus, PLUS_BUDGET_MIN: "80" }
        run: node tools/qa/plus.js
      - name: One report
        if: always()
        env: { QA_MODE: full, QA_OUT: qa/plus, QA_NOHIST: "1" }
        run: |
          mkdir -p qa/plus && sudo chown -R $USER qa/sw 2>/dev/null || true; QA_MERGE=qa/sw/plus,qa/sw/plus-b node tools/qa/qa.js
          if [ -d qa/sw/plus/base ]; then mkdir -p qa/visual/base && cp qa/sw/plus/base/*.png qa/visual/base/ 2>/dev/null || true; fi
          rm -rf qa/sw
      - name: Save
        if: always()
        run: |
          BOT_NAME=qa-plus bash .github/save.sh "QA plus: $(date -u +%FT%TZ)" qa
