# WATCHMAN (owner 21.11.2026): every 15 minutes — are the home page, catalog, a product, the cart and the shop API alive?
# Down (twice in a row within one run) → opens a GitHub issue «🚨 Сайт недоступен» (the owner gets an e-mail from GitHub);
# back up → comments and closes it. No commits (nothing to clutter the repo).
name: Watchman
on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
permissions:
  contents: read
  issues: write
concurrency: { group: watch, cancel-in-progress: false }
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: tools/sitebots/watch.js, sparse-checkout-cone-mode: false }
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - name: Check
        id: c
        run: |
          node tools/sitebots/watch.js > out.txt 2>&1 || echo "down=1" >> $GITHUB_OUTPUT
          cat out.txt
          { echo '### Дозорный'; cat out.txt; } >> $GITHUB_STEP_SUMMARY
      - name: Alarm / all clear
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          T="🚨 Сайт недоступен"
          N=$(gh issue list --state open --search "\"$T\" in:title" --json number -q '.[0].number')
          BODY=$(printf 'Дозорный (%s UTC):\n\n```\n%s\n```\n\nПроверка каждые 15 минут. Задача закроется сама, когда всё заработает.\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_' "$(date -u '+%F %H:%M')" "$(cat out.txt)")
          if [ "${{ steps.c.outputs.down }}" = 1 ]; then
            if [ -z "$N" ]; then gh issue create --title "$T" --body "$BODY"; fi
          elif [ -n "$N" ]; then
            gh issue comment "$N" --body "$(printf '✅ Всё снова работает (%s UTC).\n\n```\n%s\n```\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_' "$(date -u '+%F %H:%M')" "$(cat out.txt)")"
            gh issue close "$N"
          fi
