# Robot "home slider look" (owner 19.11.2026): every tab of the home slider at 3 sizes + "keeps turning while scrolling".
# Run: add a line to .github/home-look.txt. Result: branch `shots-home` (report.md + pictures). Read-only.
name: Home slider look
on:
  workflow_dispatch:
  schedule:
    - cron: "19 4 * * *"   # every night 04:19 UTC (owner 20.11 «1»)
  push:
    branches: [main]
    paths: [".github/home-look.txt"]
permissions:
  contents: write
concurrency: home-look
jobs:
  look:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i --no-save playwright@1.49.1
      - name: Look
        env: { PW_CHANNEL: chrome, PHOTO_OUT: "shots-home", PREVIEW_CSS: "tools/photo/preview.css", SIZES: "1536x672,1366x768,1920x1080,412x780x1,412x700x1" }
        run: |
          # a line «… q:ss_one=1» → before / after with that query (20.11 shared header preview)
          Q=$(tail -1 .github/home-look.txt | grep -o 'q:[^ ]*' | cut -c3-); HOME_AFTER_Q="$Q" node tools/photo/home-tabs.js
      - name: Save to branch shots-home
        if: always()
        run: |
          cd shots-home && git init -q -b shots-home && git config user.name photographer && git config user.email actions@users.noreply.github.com
          git add -A && git commit -qm "home look: $(date -u +%FT%TZ)"
          git push -fq "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" shots-home
