# Nightly purchase robot (25.11, «рой роботов у каждой роли» — the tester's 🆕 robot in docs/team/bots.md).
# PC + Samsung A31: product → ▶ sound → Add to cart → cart → checkout form + payment methods → cart emptied → services calculator.
# Nothing is paid or sent. A failing check gets a second try a minute later; broken in both → GitHub issue «🛒 Покупка сломана»
# (the owner gets an e-mail), all OK again → the issue is closed. Report: reports/tester/buy.md, memory: reports/tester/memory.json.
# Start by hand: a line in .github/buy.txt. Schedule: added after the trial runs (docs/team/bots.md — ladder of training).
name: Purchase robot
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/buy.txt"]
permissions:
  contents: write
  issues: write
concurrency: { group: buy-nightly, cancel-in-progress: false }
jobs:
  buy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i --no-save playwright@1.49.1
      - name: Try 1
        env: { PW_CHANNEL: chrome, PROBE_OUT: buy-nightly/t1 }
        run: node tools/probe/buy.js || true
      - name: Try 2 (only if something failed)
        env: { PW_CHANNEL: chrome, PROBE_OUT: buy-nightly/t2 }
        run: |
          if [ -f buy-nightly/t1/buy.json ] && ! grep -q false buy-nightly/t1/buy.json; then echo "all OK the first time"; exit 0; fi
          sleep 60; node tools/probe/buy.js || true
      - name: Report
        id: r
        run: |
          node tools/tester/buy-report.js buy-nightly/t1 buy-nightly/t2
          cat reports/tester/buy.md >> $GITHUB_STEP_SUMMARY
      - name: Alarm / all clear
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BROKEN: ${{ steps.r.outputs.broken }}
        run: |
          T="🛒 Покупка сломана"
          N=$(gh issue list --state open --search "\"$T\" in:title" --json number -q '.[0].number')
          FOOT=$(printf '\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_')
          if [ -n "$BROKEN" ]; then
            if [ -z "$N" ]; then gh issue create --title "$T" --body "$(cat reports/tester/buy.md)$FOOT"; else gh issue comment "$N" --body "Всё ещё сломано: $BROKEN$FOOT"; fi
          elif [ -n "$N" ]; then gh issue comment "$N" --body "✅ Путь покупки снова работает ($(date -u '+%F %H:%M') UTC).$FOOT"; gh issue close "$N"; fi
      - name: Save
        if: always()
        run: |
          BOT_NAME=buy-robot bash .github/save.sh "purchase robot: $(date -u +%FT%TZ)" reports/tester
          BOT_NAME=buy-robot GH_TOKEN=${{ github.token }} bash .github/save-branch.sh shots-ab "purchase robot: $(date -u +%FT%TZ)" buy-nightly || true
