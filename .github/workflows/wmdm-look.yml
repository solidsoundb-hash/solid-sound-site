# Read-only screenshots of the owner's own We Make Dance Music creator dashboard (to design our author panel).
# Run: add a line to .github/wmdm.txt (or Actions -> WMDM look -> Run workflow). Needs secrets WMDM_USER, WMDM_PASS.
# Result: private artifact "wmdm-screens" (7 days). Nothing is committed to the repository.
name: WMDM look
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/wmdm.txt"]
permissions:
  contents: read
jobs:
  look:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i --no-save playwright@1.49.1
      - name: Look (read-only)
        env:
          PW_CHANNEL: chrome
          WMDM_USER: ${{ secrets.WMDM_USER }}
          WMDM_PASS: ${{ secrets.WMDM_PASS }}
        run: node tools/wmdm-look.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wmdm-screens
          path: wmdm-out/
          retention-days: 7
