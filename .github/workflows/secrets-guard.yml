# (20.11.2026 owner «6») The repository is PUBLIC: every push to main is checked for passwords, API keys and tokens that
# slipped into the code (gitleaks). Found → the run is red with file + line (the secret itself is hidden in the log), so it can be
# removed and the key changed at once. Once a week the whole history is checked too.
name: Secrets guard
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "29 5 * * 0"   # Sunday 05:29 UTC — full history
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: Get gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz | tar -xz gitleaks
      - name: Scan (this push, or everything on the weekly run)
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            ./gitleaks detect --redact --no-banner -v --log-opts="${{ github.event.before }}..${{ github.sha }}"
          else
            ./gitleaks detect --redact --no-banner -v
          fi
