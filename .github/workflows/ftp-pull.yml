# Забирает с хостинга по FTP только код и настройки (наш плагин, functions.php темы, настройки кэша)
# и кладёт в папку live/. wp-config.php и uploads НЕ скачиваются.
# Запуск: коммит, меняющий .github/ftp-pull.txt (или Actions -> "FTP: pull site code" -> Run workflow).
name: "FTP: pull site code"
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/ftp-pull.txt"]
permissions:
  contents: write
concurrency: ftp-pull
jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USER: ${{ secrets.FTP_USER }}
      FTP_PASS: ${{ secrets.FTP_PASS }}
      WPC: solid-sound.net/www/wp-content
    steps:
      - uses: actions/checkout@v4
      - name: Download code and settings
        shell: bash {0}
        run: |
          mkdir -p live; LOG=live/_ftp-log.txt; echo "pull $(date -u +%FT%TZ)" > $LOG
          get() { python3 tools/ftp_sync.py download "$1" "$2" >> $LOG 2>&1 && echo "ok  $1" >> $LOG || echo "ERR $1" >> $LOG; }
          getf() { python3 tools/ftp_sync.py get "$1" "$2" >> $LOG 2>&1 && echo "ok  $1" >> $LOG || { rm -f "$2"; echo "--  $1 (missing)" >> $LOG; }; }
          get  $WPC/plugins/solid-sound-custom live/plugins/solid-sound-custom
          rm -rf live/plugins/solid-sound-custom/build
          getf $WPC/themes/Impreza/functions.php live/themes/Impreza/functions.php
          getf $WPC/wp-cache-config.php live/wp-content/wp-cache-config.php
          get  $WPC/themes/Impreza/common/functions live/themes/Impreza/common/functions
          getf $WPC/advanced-cache.php live/wp-content/advanced-cache.php
          getf solid-sound.net/www/.htaccess live/root/.htaccess
          get  $WPC/plugins/wc-multivendor-membership/controllers live/plugins/wc-multivendor-membership/controllers
          get  $WPC/plugins/wc-multivendor-membership/core live/plugins/wc-multivendor-membership/core
          get  $WPC/plugins/wc-multivendor-marketplace/core live/plugins/wc-multivendor-marketplace/core
          get  $WPC/plugins/wpforo/classes live/plugins/wpforo/classes
          getf $WPC/plugins/wpforo/wpforo.php live/plugins/wpforo/wpforo.php
          get  $WPC/plugins/wpforo/includes live/plugins/wpforo/includes
          getf $WPC/plugins/us-core/functions/grid.php live/plugins/us-core/functions/grid.php
          getf $WPC/plugins/us-core/templates/us_grid/listing.php live/plugins/us-core/templates/us_grid/listing.php
          getf $WPC/plugins/us-core/templates/elements/grid_filter.php live/plugins/us-core/templates/elements/grid_filter.php
          get  $WPC/plugins/wc-frontend-manager/core live/plugins/wc-frontend-manager/core
          get  $WPC/plugins/wc-frontend-manager/views/dashboard live/plugins/wc-frontend-manager/views/dashboard
          get  $WPC/plugins/wc-frontend-manager/controllers/dashboard live/plugins/wc-frontend-manager/controllers/dashboard
          getf $WPC/plugins/wc-frontend-manager/wc_frontend_manager.php live/plugins/wc-frontend-manager/wc_frontend_manager.php
          getf solid-sound.net/www/.user.ini live/root/.user.ini
          getf solid-sound.net/www/php.ini live/root/php.ini
          find live -name 'wp-config*.php' -delete
          find live -type f | sed 's/^/  /' >> $LOG
      - name: Commit
        if: always()
        run: |
          git config user.name "ftp-bot"; git config user.email "actions@users.noreply.github.com"
          git add live && git commit -m "FTP pull: site code snapshot" && git pull --rebase -q origin main && git push || echo "nothing new"
