# NIGHT BUYER (owner 25.11.2026, role «Тестировщик», docs/team/bots.md): every night the purchase path
# catalog → product → cart → checkout (no payment) on a computer and on the Samsung A31.
# Broken → opens the GitHub issue «🛒 Покупка сломалась» (the owner gets an e-mail); fixed → comments and closes it.
# Manual run: a line in .github/buy-night.txt. Report: reports/tester/buy-night.md (+ .csv, snapshot where it broke).
name: Night buyer
on:
  workflow_dispatch:
  schedule:
    - cron: "37 2 * * *"   # 02:37 UTC = 18:37 Pacific
  push:
    branches: [main]
    paths: [".github/buy-night.txt"]
permissions:
  contents: write
  issues: write
concurrency: { group: buy-night, cancel-in-progress: false }
jobs:
  buy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - run: npm i --no-save playwright@1.49.1
      - name: Walk the purchase path
        id: b
        env:
          PW_CHANNEL: chrome
          TEST_ADMIN_USER: ${{ secrets.TEST_ADMIN_USER }}   # only for the «Cancel an order» step-2 preview (made-up data)
          TEST_ADMIN_PASS: ${{ secrets.TEST_ADMIN_PASS }}
        run: |
          set +e; node tools/sitebots/buy-night.js > out.txt 2>&1; c=$?; set -e
          cat out.txt; cat out.txt >> $GITHUB_STEP_SUMMARY
          echo "code=$c" >> $GITHUB_OUTPUT
      - name: Alarm / all clear
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          T="🛒 Покупка сломалась"
          N=$(gh issue list --state open --search "\"$T\" in:title" --json number -q '.[0].number')
          FOOT=$(printf '\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_')
          if [ "${{ steps.b.outputs.code }}" = 2 ]; then
            if [ -z "$N" ]; then gh issue create --title "$T" --body "$(cat reports/tester/buy-night.md)$FOOT"; fi
          elif [ "${{ steps.b.outputs.code }}" = 0 ] && [ -n "$N" ]; then
            gh issue comment "$N" --body "$(printf '✅ Покупка снова проходит.\n\n')$(cat reports/tester/buy-night.md)$FOOT"
            gh issue close "$N"
          fi
      - name: Save
        if: always()
        run: |
          BOT_NAME=night-buyer bash .github/save.sh "night buyer: $(date -u +%FT%TZ)" reports/tester
